name: Daily Automated Commit

on:
  schedule:
    # Runs everyday at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check 14-day duration and perform update
        id: commit_step
        run: |
          START_DATE="2026-10-27"
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          
          # Calculate elapsed days
          START_SEC=$(date -d "$START_DATE" +%s)
          CURRENT_SEC=$(date -d "$CURRENT_DATE" +%s)
          DIFF_DAYS=$(( (CURRENT_SEC - START_SEC) / 86400 ))
          
          echo "Start date: $START_DATE"
          echo "Current date: $CURRENT_DATE"
          echo "Elapsed days: $DIFF_DAYS"
          
          if [ $DIFF_DAYS -gt 14 ]; then
            echo "14-day automated commit cycle is complete. Skipping commit."
            exit 0
          fi
          
          # Pool of simple understandable commit messages
          MESSAGES=(
            "Update daily maintenance log and notes"
            "Refactor internal code comments"
            "Update documentation notes and formatting"
            "Sync daily project status and metrics"
            "Enhance code documentation clarity"
            "Tidy up utility comments and annotations"
            "Update project changelog and activity"
            "Routine daily project maintenance"
            "Refine inline documentation details"
            "Update activity timestamps and notes"
          )
          
          # Pick random commit message
          RANDOM_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
          COMMIT_MSG="${MESSAGES[$RANDOM_INDEX]}"
          
          # Pick target file randomly
          FILES=("docs/ACTIVITY.md" "docs/UPDATES.md" "README.md")
          RANDOM_FILE_INDEX=$(( RANDOM % ${#FILES[@]} ))
          TARGET_FILE="${FILES[$RANDOM_FILE_INDEX]}"
          
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          if [ "$TARGET_FILE" = "docs/ACTIVITY.md" ]; then
            echo "| $(date -u +"%Y-%m-%d") | Maintenance | Automated daily sync: $COMMIT_MSG ($TIMESTAMP) |" >> docs/ACTIVITY.md
          elif [ "$TARGET_FILE" = "docs/UPDATES.md" ]; then
            echo "- **$(date -u +"%Y-%m-%d")**: $COMMIT_MSG at $TIMESTAMP." >> docs/UPDATES.md
          else
            echo "<!-- Last automated health check: $TIMESTAMP -->" >> README.md
          fi
          
          # Configure Git
          git config --global user.name "Bharath18-AI"
          git config --global user.email "pavanabharath834@gmail.com"
          
          git add "$TARGET_FILE"
          git commit -m "$COMMIT_MSG"
          git push origin main
