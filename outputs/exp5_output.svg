<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#17171c"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#212227"/>
  <!-- setState Card -->
  <rect x="70" y="115" width="370" height="330" rx="12" fill="#17171c" stroke="#444"/>
  <text x="95" y="150" fill="#ff9f0a" font-family="Arial" font-size="18" font-weight="bold">A. Local State (setState)</text>
  <text x="95" y="180" fill="#888" font-family="Arial" font-size="14">StatefulWidget accumulator</text>
  <rect x="95" y="200" width="320" height="80" rx="8" fill="#212227"/>
  <text x="255" y="255" fill="#ff9f0a" font-family="Consolas" font-size="44" font-weight="bold" text-anchor="middle">40</text>
  <text x="95" y="315" fill="#4caf50" font-family="Consolas" font-size="14">+1 | +5 | +10 | ×2 | Reset</text>
  <!-- Provider Card -->
  <rect x="460" y="115" width="370" height="330" rx="12" fill="#17171c" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="485" y="150" fill="#ff9f0a" font-family="Arial" font-size="18" font-weight="bold">B. Provider &amp; ChangeNotifier</text>
  <text x="485" y="180" fill="#888" font-family="Arial" font-size="14">Decoupled reactive calculation state</text>
  <rect x="485" y="200" width="320" height="80" rx="8" fill="#212227"/>
  <text x="645" y="255" fill="#ff9f0a" font-family="Consolas" font-size="44" font-weight="bold" text-anchor="middle">120.00</text>
  <text x="485" y="315" fill="#4caf50" font-family="Consolas" font-size="14">notifyListeners() updates subscribers</text>
</svg>
