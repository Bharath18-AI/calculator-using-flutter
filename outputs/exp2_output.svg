    <rect x="655" y="270" width="175" height="42" rx="8" fill="#ff9f0a"/><text x="742" y="297" fill="#000">×</text>
    <!-- Row 3 -->
    <rect x="70" y="325" width="175" height="42" rx="8" fill="#2e2f38"/><text x="157" y="352">4</text>
    <rect x="265" y="325" width="175" height="42" rx="8" fill="#2e2f38"/><text x="352" y="352">5</text>
    <rect x="460" y="325" width="175" height="42" rx="8" fill="#2e2f38"/><text x="547" y="352">6</text>
    <rect x="655" y="325" width="175" height="42" rx="8" fill="#ff9f0a"/><text x="742" y="352" fill="#000">-</text>
    <!-- Row 4 -->
    <rect x="70" y="380" width="175" height="42" rx="8" fill="#2e2f38"/><text x="157" y="407">1</text>
    <rect x="265" y="380" width="175" height="42" rx="8" fill="#2e2f38"/><text x="352" y="407">2</text>
