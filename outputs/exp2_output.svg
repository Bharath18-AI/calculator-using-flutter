    <rect x="655" y="215" width="175" height="42" rx="8" fill="#ff9f0a"/><text x="742" y="242" fill="#000">÷</text>
    <!-- Row 2 -->
    <rect x="70" y="270" width="175" height="42" rx="8" fill="#2e2f38"/><text x="157" y="297">7</text>
    <rect x="265" y="270" width="175" height="42" rx="8" fill="#2e2f38"/><text x="352" y="297">8</text>
