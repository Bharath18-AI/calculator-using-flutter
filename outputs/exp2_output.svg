<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#17171c"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#212227"/>
  <!-- Display Box -->
  <rect x="70" y="105" width="760" height="90" rx="12" fill="#17171c" stroke="#333" stroke-width="1.5"/>
  <rect x="85" y="120" width="55" height="24" rx="8" fill="#ff9f0a"/>
  <text x="96" y="137" fill="#000" font-family="Arial" font-size="12" font-weight="bold">DEG</text>
  <text x="810" y="132" fill="#888" font-family="Consolas" font-size="16" text-anchor="end">512 × 2 + 0.50 =</text>
  <text x="810" y="175" fill="#fff" font-family="Consolas" font-size="38" font-weight="300" text-anchor="end">1,024.50</text>
  <!-- Keypad Preview -->
  <g font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
